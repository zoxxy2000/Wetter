# Baut die Wetter-App und veröffentlicht sie auf GitHub Pages.
# Läuft bei jeder Änderung im Repository und zusätzlich zweimal täglich:
#   ca. 07:05 Uhr – Waldbrand- und Graslandindex (DWD aktualisiert um 7 Uhr)
#   ca. 11:15 Uhr – Pollenflug und Biowetter (DWD aktualisiert um 11 Uhr)
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: Wetter-App veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # reine Text-Änderungen (README) lösen nichts aus
  schedule:
    # GitHub rechnet in UTC und kennt keine Sommerzeit. Darum je zwei Termine;
    # der Schritt "Uhrzeit prüfen" lässt nur die Läufe zu, die nach deutscher Zeit passen.
    - cron: "5 5 * * *"     # 07:05 Uhr Sommerzeit
    - cron: "5 6 * * *"     # 07:05 Uhr Winterzeit
    - cron: "15 9 * * *"    # 11:15 Uhr Sommerzeit
    - cron: "15 10 * * *"   # 11:15 Uhr Winterzeit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keine "concurrency"-Gruppe: Die hat bei mehreren Uploads kurz hintereinander
# wartende Läufe abgebrochen ("All jobs were cancelled"). Stattdessen wartet jeder
# Lauf kurz und veröffentlicht nur, wenn er die neueste Änderung ist.

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Uhrzeit prüfen
        id: zeit
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          lauf=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Abstand zu UTC: 1 Std im Winter, 2 Std im Sommer
            off=$(( ( $(TZ=Europe/Berlin date +%-H) - $(date -u +%-H) + 24 ) % 24 ))
            h=$(echo "$PLAN" | awk '{print $2}')
            ziel=7; [ "$h" -ge 9 ] && ziel=11
            [ $(( h + off )) -eq $ziel ] || lauf=false
            echo "Plan: $PLAN, Abstand zu UTC: $off Std, Lauf: $lauf"
          fi
          echo "lauf=$lauf" >> "$GITHUB_OUTPUT"

      - name: Auf weitere Uploads warten
        id: aktuell
        if: steps.zeit.outputs.lauf == 'true' && github.event_name == 'push'
        run: |
          # Werden mehrere Dateien einzeln hochgeladen, entsteht pro Datei ein Lauf.
          # Nur der Lauf zur neuesten Änderung veröffentlicht, die anderen enden ruhig als „erfolgreich“.
          sleep 75
          neu=$(git ls-remote "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ -n "$neu" ] && [ "$neu" != "${{ github.sha }}" ]; then
            echo "Es gibt eine neuere Änderung – dieser Lauf überspringt die Veröffentlichung."
            echo "lauf=false" >> "$GITHUB_OUTPUT"
          else
            echo "lauf=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.zeit.outputs.lauf == 'true' && steps.aktuell.outputs.lauf != 'false'

      - name: DWD-Zusatzdaten holen
        if: steps.zeit.outputs.lauf == 'true' && steps.aktuell.outputs.lauf != 'false'
        run: python3 tools/hole_daten.py   # Python ist auf dem Runner schon vorhanden
        continue-on-error: true

      - name: Seite zusammenstellen
        if: steps.zeit.outputs.lauf == 'true' && steps.aktuell.outputs.lauf != 'false'
        run: |
          mkdir -p _site daten
          # Dateien einzeln kopieren: fehlt eine, wird trotzdem veröffentlicht (mit Hinweis im Protokoll)
          for f in index.html sw.js version.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png badge-96.png CNAME; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "::warning::Datei fehlt im Repository: $f"; fi
          done
          [ -d icons ] && cp -r icons _site/ || echo "::warning::Ordner icons fehlt"
          cp -r daten _site/
          echo "Veröffentlicht wird Version: $(grep -o 'APP_VERSION = "[^"]*"' version.js)"

      - uses: actions/upload-pages-artifact@v5
        if: steps.zeit.outputs.lauf == 'true' && steps.aktuell.outputs.lauf != 'false'
        with:
          path: _site

      - id: deploy
        if: steps.zeit.outputs.lauf == 'true' && steps.aktuell.outputs.lauf != 'false'
        uses: actions/deploy-pages@v5
