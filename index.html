<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#34539A">
<meta name="description" content="Wetter für Porta Westfalica und deine Orte – amtliche Daten des Deutschen Wetterdienstes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<title>Wetter</title>
<style>
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --soft:#F0F3F5; --ink:#1E2329; --muted:#66707A; --line:#D8DEE3;
  --red:#C8102E; --rain:#2F6FB3; --cloud:#B5BFC8; --cloud-dark:#7A8692; --sun:#F2A900;
  --w1:#E2B400; --w2:#EE8A00; --w3:#D7261E; --w4:#8E1B7A;
  --tab:rgba(255,255,255,.88);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1215;--surface:#161D22;--soft:#1E272E;--ink:#E5EAEE;--muted:#94A0AA;--line:#26313A;
    --rain:#6CA8E6;--cloud:#8E99A4;--cloud-dark:#65707B;--tab:rgba(20,27,32,.9);}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(62px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--rain)}
:focus-visible{outline:2px solid var(--rain);outline-offset:2px;border-radius:8px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#app{max-width:560px;margin:0 auto}
[hidden]{display:none!important}

/* ---------- Himmel ---------- */
.sky{position:relative;height:clamp(330px,52vh,460px);overflow:hidden;color:#fff;touch-action:pan-y;background:#34539A}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 22px 40px;text-shadow:0 1px 10px rgba(0,0,0,.22)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.place-btn{background:none;border:0;padding:6px 0;text-align:left;color:#fff;min-width:0}
.place-btn b{display:block;font:600 19px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-btn span{display:block;font:400 13px var(--font);opacity:.85}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.glass{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.glass.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-main{margin-top:auto}
.temp{font:300 112px/.86 var(--num);letter-spacing:-4px;margin-left:-4px}
.cond{font:500 22px/1.2 var(--font);margin-top:10px}
.hilo{font:500 16px var(--font);opacity:.92;margin-top:2px}
.rainhint{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 12px 6px 9px;border-radius:999px;
  background:rgba(8,24,52,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:500 15px var(--font);text-shadow:none}
.station{font:400 12.5px/1.35 var(--font);opacity:.82;margin-top:10px;max-width:34em}

/* ---------- Inhalt ---------- */
.body{position:relative;z-index:2;margin-top:-24px;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 14px 28px}
.blk{margin:20px 0 4px}
.blk>h2{font:600 18px/1.2 var(--font);margin:0 6px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.blk>h2 small{font:400 13px var(--font);color:var(--muted)}
.panel{background:var(--surface);border-radius:18px;padding:14px}
.panel.flush{padding:6px 4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.foot{font-size:12.5px;line-height:1.5;color:var(--muted);margin:26px 8px 0}
.foot a{color:inherit}

/* Warnstreifen */
.warnstrip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);
  border-radius:18px;padding:13px 14px;margin-top:6px}
.lvl{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--num);color:#fff}
.l1{background:var(--w1);color:#3a2e00}.l2{background:var(--w2)}.l3{background:var(--w3)}.l4{background:var(--w4)}
.warnstrip b{display:block;font:600 15.5px/1.3 var(--font)}
.warnstrip div span{display:block;font-size:13.5px;color:var(--muted)}

/* Gleich */
.nowtext{font:600 17px/1.3 var(--font)}
.nowsub{font-size:13.5px;color:var(--muted);margin-top:2px}
.nowchart{margin-top:10px}
.nowchart svg{display:block;width:100%;height:auto}

/* Schwellen */
.limits{display:grid;gap:8px}
.limit{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border-radius:14px;padding:11px 14px;
  border-left:4px solid var(--red)}
.limit b{font-weight:600}

/* Stundenband */
.band{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:2px 2px 6px;scroll-snap-type:x proximity}
.band::-webkit-scrollbar{display:none}
.hr{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border:0;background:none;
  border-radius:14px;scroll-snap-align:start}
.hr .h{font:500 13px var(--font);color:var(--muted)}
.hr .t{font:500 19px var(--num)}
.hr .pp{font:500 12px var(--num);color:var(--rain);min-height:15px}
.hr.sel{background:var(--soft)}
.hr.sel .h{color:var(--ink)}
.hr.sunm{flex-basis:58px;cursor:default}
.hr.sunm .t{font:500 14px var(--num)}
.hr.sunm .pp{color:var(--muted);font:500 11.5px var(--font)}
.hdetail{border-top:1px solid var(--line);margin:4px 2px 0;padding:12px 4px 2px}
.hdetail .ttl{font:600 15px var(--font);margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.kv div{min-width:0}
.kv span{display:block;font-size:12.5px;color:var(--muted)}
.kv b{display:block;font:500 17px var(--num);white-space:nowrap}

/* Woche */
.day{display:grid;grid-template-columns:50px 30px 34px 30px 1fr 30px;align-items:center;gap:8px;width:100%;
  padding:11px 10px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.days>div:first-child .day{border-top:0}
.day .d{font:600 15.5px var(--font)}
.day .p{font:500 12.5px var(--num);color:var(--rain);text-align:center}
.day .lo{font:500 17px var(--num);color:var(--muted);text-align:right}
.day .hi{font:500 17px var(--num);text-align:right}
.range{position:relative;height:6px;border-radius:3px;background:var(--soft)}
.range i{position:absolute;top:0;bottom:0;border-radius:3px}
.range b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--surface);
  border:2px solid var(--ink);transform:translate(-50%,-50%)}
.daydet{padding:2px 8px 12px}
.daydet .band{padding-top:0}
.daydet .hr{flex-basis:50px;padding:6px 0}
.daydet .kv{margin:8px 4px 4px}

/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:12px 14px 13px;min-width:0}
.tile .k{font:500 13px var(--font);color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font:400 30px/1.15 var(--num);margin-top:4px}
.tile .v small{font-size:16px;color:var(--muted);margin-left:2px}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.wide{grid-column:1/-1}
.arrow{display:inline-block;vertical-align:-2px}
.sunline{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.sunline div{flex:1}
.sunline b{display:block;font:400 26px/1.1 var(--num)}
.sunline span{font-size:12.5px;color:var(--muted)}
.spark svg{display:block;width:100%;height:auto;margin-top:8px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkrow a{font:500 14px var(--font);text-decoration:none;color:var(--ink);background:var(--soft);padding:7px 12px;border-radius:10px}

/* Seiten */
.page{padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
.page>h1{font:600 30px/1.1 var(--font);margin:10px 6px 4px}
.page>.sub{color:var(--muted);margin:0 6px 16px;font-size:14.5px}

/* Radar */
#map{height:min(58vh,520px);border-radius:18px;overflow:hidden;background:var(--soft);position:relative;z-index:0}
#map .leaflet-control-attribution{font-size:10px}
.rctl{display:flex;align-items:center;gap:12px;margin:12px 4px 4px}
.playbtn{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.rtime b{display:block;font:500 22px/1.1 var(--num)}
.rtime span{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--rain);margin:6px 0 2px}
.rticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px}
.legend{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:12px;color:var(--muted)}
.legend .bar{flex:1;height:8px;border-radius:4px}
.radar-msg{position:absolute;inset:auto 12px 12px 12px;z-index:500;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}

/* Historisch */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:0 2px 12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:500 14.5px var(--font);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:500 14px var(--font)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 2px 12px;align-items:end}
.dates input{width:100%;min-width:0}
.dates .btn{grid-column:1 / -1}
.dates label{font-size:12.5px;color:var(--muted)}
.chart{margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:11px var(--font);fill:var(--muted)}
.sum{font-size:14px;line-height:1.45}
.sum b{font-weight:600}

/* Warnungen */
.warn{background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px;border-left:6px solid var(--w2)}
.warn.l1{border-left-color:var(--w1)}.warn.l2{border-left-color:var(--w2)}.warn.l3{border-left-color:var(--w3)}.warn.l4{border-left-color:var(--w4)}
.warn h3{font:600 17px/1.3 var(--font);margin:0}
.warn .meta{font-size:13.5px;color:var(--muted);margin:3px 0 8px}
.warn p{margin:0 0 8px;font-size:15px}
.warn details{font-size:14.5px}
.warn summary{color:var(--rain);cursor:pointer;margin-bottom:4px}
.warn .src{font-size:12px;color:var(--muted);margin-top:6px}
.grp{font:600 15px var(--font);margin:18px 6px 8px;color:var(--muted)}
.levels{display:flex;gap:6px;margin:4px 2px 0}
.levels span{flex:1;font:500 12px var(--font);text-align:center;padding:6px 0;border-radius:8px}

/* Orte */
.plist{background:var(--surface);border-radius:18px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pm{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;align-items:center;gap:12px}
.prow .pn{flex:1;min-width:0}
.prow .pn b{display:block;font:600 16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pt{font:400 26px var(--num)}
.prow.cur .pn b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:2px}
.ibtn{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.search{position:relative;margin:14px 0 6px}
.results{background:var(--surface);border-radius:14px;margin-top:6px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-top:1px solid var(--line)}
.results button:first-child{border-top:0}
.results small{color:var(--muted)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 14px;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting div span{display:block;font-size:13px;color:var(--muted)}
.switch{position:relative;width:50px;height:30px;flex:0 0 50px;border-radius:15px;border:0;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked=true]{background:#2E9E5B}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 14px}
.thr label{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],select{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.btn{font:600 15px var(--font);border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:none;color:var(--red);padding-left:4px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:14px 14px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px}
.sheethead h2{font:600 20px var(--font);margin:0}
#emap{height:220px;border-radius:14px;overflow:hidden;margin:10px 0 4px;background:var(--soft);position:relative;z-index:0}
.hint{font-size:12.5px;color:var(--muted);margin:2px 4px 0}
.stations{background:var(--surface);border-radius:14px;overflow:hidden;margin-top:8px}
.st{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .sn{flex:1;min-width:0}
.st .sn b{display:block;font-weight:600}
.st .sn span{font-size:13px;color:var(--muted)}
.tag{font:600 11.5px var(--font);padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.rec{background:#E3F2E8;color:#1E7A45}
@media (prefers-color-scheme:dark){.tag.rec{background:#173525;color:#7DD3A0}}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px;display:grid;place-items:center}
.check.on{border-color:var(--rain);background:var(--rain);color:#fff}
.row2{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.lbl{font:600 15px var(--font);margin:18px 4px 6px}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{display:flex;max-width:560px;margin:0 auto}
#tabs button{flex:1;border:0;background:none;color:var(--muted);font:500 11.5px var(--font);padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button[aria-current=page]{color:var(--ink)}
#tabs button[aria-current=page] svg{color:var(--red)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font:600 11px/18px var(--font);padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){body{padding-top:0}#app{box-shadow:0 0 0 1px var(--line)}}
</style>
</head>
<body>
<div id="app">
  <section id="tab-wetter">
    <header class="sky" id="sky">
      <canvas id="skycanvas" aria-hidden="true"></canvas>
      <div class="hero">
        <div class="hero-top">
          <button class="place-btn" data-a="tab:orte" aria-label="Orte verwalten">
            <b id="h-place">–</b><span id="h-label"></span>
            <div class="dots" id="h-dots"></div>
          </button>
          <button class="glass" id="refresh" data-a="refresh" aria-label="Aktualisieren">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
        </div>
        <div class="hero-main">
          <div class="temp" id="h-temp">–</div>
          <div class="cond" id="h-cond"></div>
          <div class="hilo" id="h-hilo"></div>
          <div id="h-rain"></div>
          <div class="station" id="h-station"></div>
        </div>
      </div>
    </header>
    <div class="body" id="wetter-body"></div>
  </section>
  <section id="tab-radar" class="page" hidden></section>
  <section id="tab-historisch" class="page" hidden></section>
  <section id="tab-warnungen" class="page" hidden></section>
  <section id="tab-orte" class="page" hidden></section>
</div>

<nav id="tabs" aria-label="Bereiche"><div class="in">
  <button data-a="tab:wetter" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="3.2"/><path d="M9 2.5v1.3M3.8 4.5l.9.9M2.5 9h1.3"/><path d="M8 19h9.5a3.6 3.6 0 0 0 .4-7.2 5 5 0 0 0-9.5 1.3A3 3 0 0 0 8 19z" fill="var(--bg)"/></svg>Wetter</button>
  <button data-a="tab:radar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5.5-5.5"/></svg>Radar</button>
  <button data-a="tab:historisch"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Historisch</button>
  <button data-a="tab:warnungen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>Warnungen<span class="badge" id="warnbadge" hidden></span></button>
  <button data-a="tab:orte"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Orte</button>
</div></nav>
<div id="sheet" hidden></div>

<script>
"use strict";

const Astro = (() => {

    const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dc)) / (Math.cos(phi) * Math.cos(dc)));

const Radolan = (() => {

    const p = lat * Math.PI / 180, l = lon * Math.PI / 180, rho = A * mc * t(p) / tc;
    return { c: rho * Math.sin(l - L0) / 1000, r: rho * Math.cos(l - L0) / 1000 }; // km, Zeile wächst nach Süden

})();

/* ---------- Radar ---------- */
async function inflate16(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint16Array(await new Response(stream).arrayBuffer());
}
async function ladeRadar(p) {
  const kann = typeof DecompressionStream !== "undefined";
  const j = await getJSON(`${BS}/radar?lat=${p.lat.toFixed(4)}&lon=${p.lon.toFixed(4)}&distance=${CFG.radarKm * 1000}&tz=Europe/Berlin${kann ? "" : "&format=plain"}`, { timeout: 30000 });
  const recs = j.radar || []; if (!recs.length) throw new Error("Keine Radardaten verfügbar.");
  let W = 0, H = 0; const frames = [];
  for (const r of recs) {
    let d;
    if (typeof r.precipitation_5 === "string") d = await inflate16(r.precipitation_5);
    else { const rows = r.precipitation_5; H = rows.length; W = rows[0].length; d = new Uint16Array(W * H); rows.forEach((row, i) => d.set(row, i * W)); }
    frames.push({ t: new Date(r.timestamp), d });
  }
  if (!W) {
    if (Array.isArray(j.bbox) && j.bbox.length === 4) { H = j.bbox[2] - j.bbox[0] + 1; W = j.bbox[3] - j.bbox[1] + 1; }
    if (W * H !== frames[0].d.length) { W = H = Math.round(Math.sqrt(frames[0].d.length)); }
  }
  const lp = j.latlon_position; let px = lp?.x ?? (Array.isArray(lp) ? lp[0] : null), py = lp?.y ?? (Array.isArray(lp) ? lp[1] : null);
  if (px == null || px < 0 || px >= W || py < 0 || py >= H) { px = (W - 1) / 2; py = (H - 1) / 2; }
  const f = Radolan(p.lat, p.lon), off = { c: f.c - px, r: f.r - py };
  const ci = Math.round(px), ri = Math.round(py);
  const series = frames.map(fr => {
    let m = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = ci + dx, y = ri + dy;
      if (x >= 0 && y >= 0 && x < W && y < H) { const v = fr.d[y * W + x]; if (v < 30000 && v > m) m = v; }
    }
    return { t: fr.t, mmh: m * 0.12 };
  });
  return { pid: p.id, lat: p.lat, lon: p.lon, frames, W, H, off, series, ts: Date.now(), urls: [] };
}
function nowcast() {
  const R = S.radar, p = aktOrt();
  if (!R || R.pid !== p.id || Date.now() - R.ts > 20 * 60e3) return null;
  const now = Date.now();
  const fut = R.series.filter(s => s.t.getTime() >= now - 4 * 60e3);
  if (fut.length < 3) return null;
  const jetzt = fut[0].mmh, max = Math.max(...fut.map(s => s.mmh)), nass = v => v >= 0.1;
  const minVon = s => Math.max(0, (s.t.getTime() - now) / 60e3);
  let text = null, zeigen = false, start = null;
  const kalt = (S.daten[p.id]?.cur?.temp ?? 10) <= 1;
  const art = kalt ? "Schneefall" : "Regen";
  if (nass(jetzt)) {
    zeigen = true;
    let ende = null;
    for (let i = 1; i < fut.length - 1; i++) if (!nass(fut[i].mmh) && !nass(fut[i + 1].mmh)) { ende = fut[i]; break; }
    text = ende ? `${art} hört ${relMin(minVon(ende))} auf` : `${art} hält mindestens 2 Std an`;
  } else {
    const s = fut.find(x => nass(x.mmh));
    if (s) {
      zeigen = true; start = minVon(s);
      const peak = Math.max(...fut.filter(x => x.t >= s.t).slice(0, 12).map(x => x.mmh));
      const stufe = kalt ? (peak < 1 ? "Leichter " : "") + "Schneefall" : `${regenStufe(peak)} Regen`;
      const r = relMin(start);
      text = r === "gleich" ? `${stufe} beginnt gleich` : `${stufe} ${r}`;

  return { zeigen, text, max, start, series: fut, jetzt };
}

/* ---------- Pegel ---------- */
async function ladePegel() {
  const st = CFG.pegel.station;
  const [info, meas, wv] = await Promise.allSettled([
    getJSON(`${PO}/stations/${st}.json?includeTimeseries=true&includeCurrentMeasurement=true`),
    getJSON(`${PO}/stations/${st}/W/measurements.json?start=P2D`),
    getJSON(`${PO}/stations/${st}/WV/measurements.json`)
  ]);
  if (info.status === "rejected" && meas.status === "rejected") throw new Error("Pegel nicht erreichbar");
  const ts = info.status === "fulfilled" ? (info.value.timeseries || []).find(t => t.shortname === "W") : null;
  const cm = ts?.currentMeasurement;
  const m = meas.status === "fulfilled" ? meas.value.map(x => [new Date(x.timestamp).getTime(), x.value]) : [];
  const last = cm ? { t: new Date(cm.timestamp).getTime(), v: cm.value } : m.length ? { t: m[m.length - 1][0], v: m[m.length - 1][1] } : null;
  const vorher = h => { const z = last.t - h * 3600e3; const x = m.find(e => e[0] >= z); return x ? last.v - x[1] : null; };
  const now = Date.now();
  const prog = wv.status === "fulfilled" ? wv.value.map(x => [new Date(x.timestamp).getTime(), x.value]).filter(x => x[0] > now) : [];
  const progAt = h => { const z = now + h * 3600e3; const x = prog.find(e => e[0] >= z); return x ? x[1] : null; };
  S.pegel = { ts: Date.now(), name: info.value?.longname || st, water: info.value?.water?.longname || CFG.pegel.gewaesser, v: last?.v, t: last?.t, trend: cm?.trend, state: cm?.stateMnwMhw, d6: last ? vorher(6) : null, d24: last ? vorher(24) : null, series: m.filter((_, i) => i % 3 === 0), p6: progAt(6), p24: progAt(24) };
  store.set("pegel", S.pegel);
}

/* =====================================================================
   Aktualisieren
   ===================================================================== */
let refreshTimer = null;
async function aktualisiere() {
  if (S.busy) return;
  S.busy = true; $("#refresh").classList.add("busy");
  if (S.gps.on) await gpsAktualisieren(true);
  const p = aktOrt();
  try { await ladeOrt(p); S.err = null; }
  catch (e) { S.err = e.message; if (!S.daten[p.id]) toast(e.message); }
  render();
  const jobs = [];
  jobs.push(ladeRadar(p).then(R => { S.radar = R; S.radarErr = null; }).catch(e => { S.radarErr = "Radar nicht erreichbar."; console.warn(e); }));
  if (S.settings.extras) jobs.push(ladePegel().then(() => { S.pegelErr = false; }).catch(e => { S.pegelErr = true; console.warn(e); }));
  await Promise.all(jobs);
  S.busy = false; $("#refresh").classList.remove("busy");
  render();
  // andere Orte im Hintergrund (für Liste, Warnungen)
  for (const q of alleOrte()) if (q.id !== p.id) { try { await ladeOrt(q); } catch { /* still */ } }
  pruefeWarnungen(); renderBadge();
  if (S.tab === "orte" || S.tab === "warnungen") render();
  clearTimeout(refreshTimer); refreshTimer = setTimeout(aktualisiere, CFG.refreshMin * 60e3);
}
function ausCacheLaden() {
  for (const p of alleOrte()) {
    const raw = store.get("raw." + p.id, null);
    if (raw) { S.raw[p.id] = raw; try { S.daten[p.id] = verarbeite(raw, p); } catch (e) { console.warn(e); } }

  <div class="seg" role="tablist"><button class="${H.mode === "zeitraum" ? "on" : ""}" data-a="hmode:zeitraum">Zeitraum</button><button class="${H.mode === "monat" ? "on" : ""}" data-a="hmode:monat">Monat im Vergleich</button></div>`;

  } else {

async function histLaden() {
  const H = S.hist, p = aktOrt();
  if (H.mode === "zeitraum") { H.von = $("#hvon")?.value || H.von; H.bis = $("#hbis")?.value || H.bis; }
  else H.monat = +($("#hmon")?.value ?? H.monat);
  H.busy = true; H.err = null; renderHist();
  try {
    if (H.mode === "zeitraum") {
      const von = new Date(H.von + "T00:00"), bis = new Date(H.bis + "T00:00");
      if (!(von <= bis)) throw new Error("Das Startdatum muss vor dem Enddatum liegen.");
      if ((bis - von) / 864e5 > 400) throw new Error("Bitte höchstens ein Jahr auswählen.");
      const hours = await stundenHolen(p, von, addDays(bis, 1));
      H.res = { mode: "zeitraum", pid: p.id, ...tagesWerte(hours, von, bis), quellen: hours.quellen };
    } else {
      const m = H.monat, heute = new Date(), jahre = [];
      for (let y = heute.getFullYear(); jahre.length < 10; y--) { if (y === heute.getFullYear() && m > heute.getMonth()) continue; jahre.unshift(y); }
      const res = await Promise.all(jahre.map(async y => {
        const a = new Date(y, m, 1), b = new Date(y, m + 1, 1);
        try { const hrs = await stundenHolen(p, a, b > heute ? heute : b); const tw = tagesWerte(hrs, a, addDays(b, -1)); return { y, tmean: avg(tw.tage.map(t => t.tmean)), tmax: maxBy(tw.tage, "tmax"), prec: sum(tw.tage.map(t => t.prec)), sun: sum(tw.tage.map(t => t.sun)), n: tw.tage.length, teil: b > heute }; }
        catch { return { y, tmean: null, prec: null, n: 0 }; }
      }));
      H.res = { mode: "monat", pid: p.id, monat: m, jahre: res };
    }
  } catch (e) { H.err = e.message || "Messwerte nicht erreichbar."; }
  H.busy = false; renderHist();
}
async function stundenHolen(p, von, bis) {
  const chunks = []; let a = new Date(von);
  while (a < bis) { const b = new Date(Math.min(addDays(a, 60).getTime(), bis.getTime())); chunks.push([new Date(a), b]); a = b; }
  const res = await Promise.all(chunks.map(([a, b]) => getJSON(`${BS}/weather?${ortQuery(p)}&date=${ymd(a)}&last_date=${ymd(b)}&tz=Europe/Berlin`, { timeout: 40000 })));
  const seen = new Set(), out = [], quellen = new Map();
  res.forEach(j => {
    (j.sources || []).forEach(s => { if (s.station_name) quellen.set(s.station_name, s.distance); });
    (j.weather || []).forEach(w => { if (seen.has(w.timestamp)) return; seen.add(w.timestamp); out.push(w); });
  });
  out.quellen = [...quellen.entries()];
  return out;
}
function tagesWerte(hours, von, bis) {
  const map = new Map();

      prec: sum(a.map(w => w.precipitation)), gust: Math.max(...a.map(w => w.wind_gust_speed ?? 0)), wind: avg(a.map(w => w.wind_speed)),
      pres: avg(a.map(w => w.pressure_msl)), hum: avg(a.map(w => w.relative_humidity)), sun: sum(a.map(w => w.sunshine)) / 60 };
  });

}

        if (o.werte) g += `<text x="${X(i).toFixed(1)}" y="${(Math.min(y, y0) - 4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${nf(v, o.dez || 0)}</text>`;

  let total = 0;
  const reihen = [p, ...orte.filter(o => o.id !== p.id)];
  reihen.forEach(o => {
    const d = S.daten[o.id]; if (!d) return;
    total += d.alerts.length;
    if (!d.alerts.length) { if (o.id === p.id) h += `<div class="panel" style="margin-bottom:10px"><b>${esc(o.name)}</b><div class="muted">Keine amtlichen Warnungen.</div></div>`; return; }
    h += `<div class="grp">${esc(o.name)}</div>`;
    [...d.alerts].sort((a, b) => sevStufe(b.sev) - sevStufe(a.sev)).forEach(a => {
      const lv = sevStufe(a.sev), von = a.onset ? new Date(a.onset) : null, bis = a.exp ? new Date(a.exp) : null;
      h += `<article class="warn l${lv}"><h3>${esc(a.head || a.ev)}</h3><div class="meta">Stufe ${lv} von 4${von && von > Date.now() ? `, ab ${zeitText(von)}` : ""}${bis ? `, gültig bis ${zeitText(bis)}` : ""}</div>
        <p>${esc(a.desc)}</p>${a.instr ? `<details><summary>Handlungsempfehlung</summary><p>${esc(a.instr)}</p></details>` : ""}
        <div class="src">Quelle: Deutscher Wetterdienst${a.eff ? `, Stand ${hm(new Date(a.eff))} Uhr` : ""}</div></article>`;
    });
  });
  h += `<section class="blk"><h2>Vier amtliche Stufen</h2><div class="levels"><span class="l1">Wetter&shy;warnung</span><span class="l2">Markant</span><span class="l3">Unwetter</span><span class="l4">Extrem</span></div><p class="foot" style="margin-top:10px">Die Stufe kommt vom DWD. Mehr unter <a href="${CFG.links.warnungen}" target="_blank" rel="noopener">wettergefahren.de</a>.</p></section>`;
  el.innerHTML = h;
}
function renderBadge() {
  const n = alleOrte().reduce((s, o) => s + (S.daten[o.id]?.alerts.length || 0), 0);
  const b = $("#warnbadge"); b.hidden = !n; b.textContent = n;
}
async function pruefeWarnungen() {
  const neu = [];
  alleOrte().forEach(o => (S.daten[o.id]?.alerts || []).forEach(a => { const k = o.id + ":" + a.id; if (!S.seenAlerts.includes(k)) neu.push({ k, o, a }); }));
  if (!neu.length) return;
  S.seenAlerts = [...S.seenAlerts, ...neu.map(x => x.k)].slice(-200); store.set("seenAlerts", S.seenAlerts);
  if (!S.settings.notify || !("Notification" in window) || Notification.permission !== "granted") return;
  for (const { o, a } of neu) {
    const lv = sevStufe(a.sev);
    const title = a.head || a.ev || "Amtliche Warnung";
    const body = `${o.name}, Stufe ${lv} von 4${a.exp ? ", bis " + zeitText(new Date(a.exp)) : ""}`;
    try {
      const reg = await navigator.serviceWorker?.getRegistration();
      if (reg) reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png", tag: a.id });
      else new Notification(title, { body, icon: "icon-192.png" });
    } catch (e) { console.warn(e); }
  }
}

/* =====================================================================
   Orte & Einstellungen
   ===================================================================== */
function renderOrte() {
  const el = $("#tab-orte"), orte = alleOrte(), cur = aktOrt();
  let h = `<h1>Orte</h1><p class="sub">Tippe einen Ort an, um sein Wetter zu sehen.</p><div class="plist">`;
  orte.forEach(o => {
    const d = S.daten[o.id], c = d?.cur;
    h += `<div class="prow${o.id === cur.id ? " cur" : ""}"><button class="pm" data-a="place:${o.id}">${c ? ico(c.icon, 30) : ""}<span class="pn"><b>${esc(o.name)}</b><span>${esc(o.label || (o.gps ? "Standort wird ermittelt" : ""))}${o.station ? ", Station angepinnt" : ""}</span></span><span class="pt">${c?.temp != null ? deg(c.temp) : ""}</span></button>${o.gps ? "" : `<button class="ibtn" data-a="edit:${o.id}" aria-label="${esc(o.name)} bearbeiten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>`}</div>`;
  });
  h += `</div>
  <div class="search"><input type="search" id="qsearch" placeholder="Ort in Deutschland hinzufügen" autocomplete="off" aria-label="Ort suchen"><div class="results" id="qres" hidden></div></div>
  <section class="blk"><h2>Einstellungen</h2><div class="plist">
    <div class="setting"><div>Aktueller Standort<span>Wetter für die GPS-Position, nur auf diesem Gerät verarbeitet</span></div><button class="switch" role="switch" aria-checked="${S.gps.on}" data-a="gps" aria-label="Aktueller Standort"></button></div>
    <div class="setting"><div>Mitteilung bei neuer Warnung<span>Meldet sich, wenn der DWD für einen deiner Orte warnt. Funktioniert, solange die App im Hintergrund geöffnet ist.</span></div><button class="switch" role="switch" aria-checked="${S.settings.notify}" data-a="notify" aria-label="Mitteilungen"></button></div>
    <div class="setting"><div>Für den Einsatz<span>Weser-Pegel, Schwellwerte und Waldbrand-Links im Wetter-Tab</span></div><button class="switch" role="switch" aria-checked="${S.settings.extras}" data-a="extras" aria-label="Einsatz-Bereich"></button></div>
    ${S.settings.extras ? `<div class="thr"><div><label for="t-boen">Böen ab km/h</label><input type="number" id="t-boen" inputmode="numeric" value="${S.settings.schwellen.boen}"></div><div><label for="t-frost">Frost ab °C</label><input type="number" id="t-frost" inputmode="decimal" value="${S.settings.schwellen.frost}"></div><div><label for="t-sicht">Sicht unter m</label><input type="number" id="t-sicht" inputmode="numeric" value="${S.settings.schwellen.sicht}"></div></div>` : ""}
    ${S.installEvt ? `<div class="setting"><div>Als App installieren<span>Legt die Wetter-App auf den Startbildschirm</span></div><button class="btn" data-a="install">Installieren</button></div>` : ""}
  </div></section>
  <p class="foot">Keine Anmeldung, keine Tracker. Orte und Einstellungen bleiben auf diesem Gerät. Daten: Deutscher Wetterdienst über Bright Sky, Ortssuche: Open-Meteo, Karte: OpenStreetMap und CARTO.</p>`;
  el.innerHTML = h;
  const qs = $("#qsearch"); let to = 0;
  qs.addEventListener("input", () => { clearTimeout(to); to = setTimeout(() => suche(qs.value.trim()), 300); });
  ["boen", "frost", "sicht"].forEach(k => { const i = $("#t-" + k); if (i) i.addEventListener("change", () => { const v = parseFloat(i.value); if (!isNaN(v)) { S.settings.schwellen[k] = v; speichere(); } }); });
}
let suchErg = [];
async function suche(q) {
  const box = $("#qres"); if (!box) return;
  if (q.length < 2) { box.hidden = true; return; }
  try {
    const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=de&countryCode=DE`);
    suchErg = j.results || [];
    box.hidden = false;
    box.innerHTML = suchErg.length ? suchErg.map((r, i) => `<button data-a="add:${i}">${esc(r.name)} <small>${esc([r.admin3 !== r.name ? r.admin3 : null, r.admin2, r.admin1].filter(Boolean).join(", "))}</small></button>`).join("") : `<div style="padding:12px 14px" class="muted">Kein Ort gefunden. Prüfe die Schreibweise.</div>`;
  } catch { box.hidden = false; box.innerHTML = `<div style="padding:12px 14px" class="muted">Ortssuche nicht erreichbar.</div>`; }
}
function ortHinzu(i) {
  const r = suchErg[i]; if (!r) return;
  const p = { id: "p" + Date.now().toString(36), name: r.name, label: [r.admin2, r.admin1].filter(Boolean).join(", "), lat: r.latitude, lon: r.longitude, station: null };
  S.places.push(p); S.curId = p.id; speichere();
  ladeOrt(p).catch(() => { }).then(() => render());
  oeffneEdit(p.id);
}
async function gpsAktualisieren(still) {
  if (!("geolocation" in navigator)) { if (!still) toast("Standort wird von diesem Browser nicht unterstützt."); return false; }
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: false, maximumAge: 10 * 60e3, timeout: 12000 }));
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    const moved = S.gps.lat == null || Math.abs(lat - S.gps.lat) + Math.abs(lon - S.gps.lon) > 0.01;
    S.gps.lat = lat; S.gps.lon = lon;
    if (moved || !S.gps.label) {
      try {
        const j = await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&accept-language=de`, { timeout: 8000 });
        const a = j.address || {}; S.gps.label = a.village || a.town || a.city || a.suburb || a.municipality || "";
      } catch { /* optional */ }
    }
    speichere(); return true;
  } catch (e) {
    if (!still) toast(e.code === 1 ? "Standortfreigabe verweigert. Erlaube den Zugriff in den Browser-Einstellungen." : "Standort konnte nicht ermittelt werden.");
    return false;
  }
}

/* ---------- Ort bearbeiten (Sheet) ---------- */
const ED = { id: null, lat: 0, lon: 0, station: null, map: null, marker: null, stations: null, elev: null };
function oeffneEdit(id) {
  const p = S.places.find(x => x.id === id); if (!p) return;
  Object.assign(ED, { id, lat: p.lat, lon: p.lon, station: p.station, map: null, marker: null, stations: null, elev: null });
  const i = S.places.indexOf(p);
  const sh = $("#sheet"); sh.hidden = false;
  sh.innerHTML = `<div class="sheetbox" role="dialog" aria-modal="true" aria-label="Ort bearbeiten">
    <div class="sheethead"><h2>Ort bearbeiten</h2><button class="ibtn" data-a="close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <label class="lbl" for="e-name" style="display:block">Name</label><input type="text" id="e-name" value="${esc(p.name)}" maxlength="40" placeholder="z. B. Wache, Zuhause, Badestelle">
    <div class="lbl">Position</div><div id="emap"></div><p class="hint">Verschieb den Punkt dorthin, wo dein Wetter wirklich ist.</p>
    <div class="lbl">Station</div><div class="stations" id="e-st"><div class="st muted">Stationen werden geladen …</div></div>
    <p class="hint">Angepinnt bedeutet: Diese Station bleibt, auch wenn eine andere näher wäre.</p>
    <div class="row2"><button class="btn" data-a="save">Speichern</button>${i > 0 ? `<button class="btn ghost" data-a="moveup">Nach oben</button>` : ""}<button class="btn danger" data-a="delete">Ort löschen</button></div>
  </div>`;
  ladeLeaflet().then(L => {
    ED.map = L.map("emap", { zoomControl: false }).setView([ED.lat, ED.lon], 12);
    kachelLayer(L).addTo(ED.map);
    ED.marker = L.marker([ED.lat, ED.lon], { draggable: true, icon: L.divIcon({ className: "", html: `<div style="width:22px;height:22px;border-radius:50%;background:#C8102E;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)"></div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(ED.map);
    ED.marker.on("dragend", () => { const ll = ED.marker.getLatLng(); ED.lat = +ll.lat.toFixed(4); ED.lon = +ll.lng.toFixed(4); ladeStationen(); });
    ED.map.on("click", e => { ED.marker.setLatLng(e.latlng); ED.lat = +e.latlng.lat.toFixed(4); ED.lon = +e.latlng.lng.toFixed(4); ladeStationen(); });
    setTimeout(() => ED.map.invalidateSize(), 80);
  }).catch(() => { $("#emap").innerHTML = `<div class="radar-msg">Karte nicht verfügbar.</div>`; });
  ladeStationen();
}
async function ladeStationen() {
  const box = $("#e-st"); if (!box) return;
  try {
    const [src, el] = await Promise.all([
      getJSON(`${BS}/sources?lat=${ED.lat}&lon=${ED.lon}&max_dist=40000`),
      getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${ED.lat}&longitude=${ED.lon}`).catch(() => null)
    ]);
    ED.elev = el?.elevation?.[0] ?? null;
    const m = new Map();
    (src.sources || []).forEach(s => {
      if (!s.dwd_station_id) return;
      const e = m.get(s.dwd_station_id) || { id: s.dwd_station_id, name: s.station_name, h: s.height, km: s.distance / 1000, typen: new Set(), last: null };
      e.typen.add(s.observation_type); if (s.last_record && (!e.last || s.last_record > e.last)) e.last = s.last_record;
      m.set(s.dwd_station_id, e);
    });
    const live = Date.now() - 3 * 864e5;
    ED.stations = [...m.values()].map(e => ({ ...e, live: (e.typen.has("synop") || e.typen.has("current")) && (!e.last || new Date(e.last).getTime() > live) }))
      .map(e => ({ ...e, score: e.km + (ED.elev != null && e.h != null ? Math.abs(e.h - ED.elev) / 25 : 0) }))
      .sort((a, b) => a.km - b.km).slice(0, 8);
    const rec = ED.stations.filter(s => s.live).sort((a, b) => a.score - b.score)[0];
    stationenHtml(rec?.id);
  } catch { box.innerHTML = `<div class="st muted">Stationen nicht erreichbar.</div>`; }
}
function stationenHtml(rec) {
  const box = $("#e-st"); if (!box || !ED.stations) return;
  let h = `<button class="st" data-a="pin:"><span class="check${!ED.station ? " on" : ""}">${!ED.station ? "✓" : ""}</span><span class="sn"><b>Automatisch</b><span>Bright Sky wählt die passende Station</span></span></button>`;
  ED.stations.forEach(s => {
    const on = ED.station === s.id;
    h += `<button class="st" data-a="pin:${esc(s.id)}"><span class="check${on ? " on" : ""}">${on ? "✓" : ""}</span><span class="sn"><b>${esc(s.name)}</b><span>${s.h != null ? rnd(s.h) + " m, " : ""}${nf(s.km, 1)} km${s.live ? "" : ", ohne aktuelle Messung"}</span></span>${s.id === rec ? `<span class="tag rec">Empfohlen</span>` : ""}</button>`;
  });
  box.innerHTML = h; box.dataset.rec = rec || "";
}
function speichereEdit() {
  const p = S.places.find(x => x.id === ED.id); if (!p) return;
  const name = $("#e-name").value.trim(); if (name) p.name = name;
  const moved = p.lat !== ED.lat || p.lon !== ED.lon;
  p.lat = ED.lat; p.lon = ED.lon; p.station = ED.station || null;
  speichere(); schliesseSheet();
  delete S.daten[p.id]; if (S.radar?.pid === p.id && moved) S.radar = null;
  S.curId = p.id; S.tab = "wetter"; S.selHour = 0; render(); window.scrollTo(0, 0); aktualisiere();
}
function schliesseSheet() { if (ED.map) { ED.map.remove(); ED.map = null; } $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }

/* =====================================================================
   Ereignisse
   ===================================================================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.closest("#sheet") && e.target.id === "sheet") return;
  const [a, arg] = el.dataset.a.split(/:(.*)/s);
  switch (a) {
    case "tab": S.tab = arg; if (arg !== "radar") stopPlay(); render(); window.scrollTo(0, 0); break;
    case "refresh": aktualisiere(); break;
    case "hour": {
      S.selHour = +arg;
      document.querySelectorAll("#band .hr").forEach(b => b.classList.toggle("sel", b.dataset.a === "hour:" + arg));
      const d = S.daten[aktOrt().id]; const it = bandEintraege(d, aktOrt()).filter(x => !x.marker)[S.selHour];
      $("#hdetail").innerHTML = stundeDetail(it?.h); break;
    }
    case "day": S.openDay = S.openDay === arg ? null : arg; { const d = S.daten[aktOrt().id]; $(".days").innerHTML = wocheHtml(d); } break;
    case "place": S.curId = arg; S.selHour = 0; S.openDay = null; speichere(); S.tab = "wetter"; render(); window.scrollTo(0, 0); aktualisiere(); break;
    case "edit": oeffneEdit(arg); break;
    case "add": ortHinzu(+arg); break;
    case "close": schliesseSheet(); break;
    case "save": speichereEdit(); break;
    case "moveup": { const i = S.places.findIndex(x => x.id === ED.id); if (i > 0) { [S.places[i - 1], S.places[i]] = [S.places[i], S.places[i - 1]]; speichere(); } schliesseSheet(); render(); break; }
    case "delete": {
      if (S.places.length <= 1) { toast("Mindestens ein Ort muss bleiben."); break; }
      const p = S.places.find(x => x.id === ED.id);
      if (!confirm(`„${p.name}“ löschen?`)) break;
      S.places = S.places.filter(x => x.id !== ED.id); if (S.curId === ED.id) S.curId = S.places[0].id;
      try { localStorage.removeItem("wetter.raw." + ED.id); } catch { }
      speichere(); schliesseSheet(); render(); break;
    }
    case "pin": ED.station = arg || null; stationenHtml($("#e-st")?.dataset.rec); break;
    case "gps": {
      if (S.gps.on) { S.gps.on = false; if (S.curId === "gps") S.curId = S.places[0].id; speichere(); render(); break; }
      el.setAttribute("aria-checked", "true");
      if (await gpsAktualisieren(false)) { S.gps.on = true; S.curId = "gps"; speichere(); render(); aktualisiere(); }
      else el.setAttribute("aria-checked", "false");
      break;
    }
    case "notify": {
      if (S.settings.notify) { S.settings.notify = false; speichere(); render(); break; }
      if (!("Notification" in window)) { toast("Mitteilungen werden von diesem Browser nicht unterstützt."); break; }
      const perm = await Notification.requestPermission();
      if (perm === "granted") { S.settings.notify = true; speichere(); toast("Mitteilungen eingeschaltet."); }
      else toast("Mitteilungen wurden im Browser nicht erlaubt.");
      render(); break;
    }
    case "extras": S.settings.extras = !S.settings.extras; speichere(); render(); if (S.settings.extras && !S.pegel) ladePegel().then(render).catch(() => { }); break;
    case "install": if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; render(); } break;
    case "rplay": togglePlay(); break;
    case "hmode": S.hist.mode = arg; S.hist.err = null; renderHist(); break;
    case "hpreset": {
      const n = +arg, h = new Date(); S.hist.preset = arg; S.hist.bis = ymd(addDays(h, -1)); S.hist.von = ymd(addDays(h, -n)); renderHist(); histLaden(); break;
    }
    case "hload": S.hist.preset = null; histLaden(); break;
  }
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") schliesseSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) schliesseSheet(); });
// Wischen zwischen Orten
(() => {
  let x0 = null, y0 = null;
  const sky = $("#sky");
  sky.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  sky.addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const o = alleOrte(); if (o.length < 2) return;
    const i = o.findIndex(p => p.id === aktOrt().id), n = o[(i + (dx < 0 ? 1 : -1) + o.length) % o.length];
    S.curId = n.id; S.selHour = 0; S.openDay = null; speichere(); render(); aktualisiere();
  }, { passive: true });
})();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { const d = S.daten[aktOrt().id]; if (!d || Date.now() - d.ts > 5 * 60e3) aktualisiere(); }
});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; if (S.tab === "orte") render(); });

/* =====================================================================
   Start
   ===================================================================== */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e));
}
if (!S.curId || !alleOrte().some(p => p.id === S.curId)) S.curId = alleOrte()[0].id;
Sky.init($("#skycanvas"));
ausCacheLaden();
render();
aktualisiere();
</script>
